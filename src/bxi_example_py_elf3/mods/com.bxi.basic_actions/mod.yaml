schema: 1
id: com.bxi.basic_actions
name: 半身鼓掌测试
version: 1.0.0
api: ">=4,<5"
enable: true
entrypoint: plugin:create_mod
visibility: public
requires: []
conflicts: []
python_exports: []
runtime_requirements:
  python: []
  ros:
    - package: rclpy
  system: []

events:
  zero_torque:
    slot: btn_2
    value: 1
  pd_brake:
    slot: btn_3
    value: 1
  initial_pos:
    slot: btn_4
    value: 1
  toggle_pause:
    slot: btn_9
    value: 1
  applause:
    slot: btn_10
    value: 5

states:
  zero_torque:
    manifest:
      label: 零力矩
      priority: 990
      group: Base
      icon: do_not_disturb_on
      confirm: true
      confirm_message: 所有电机进入零力矩模式，机器人将完全失去支撑能力，请确保机器人处于安全状态
  imu_protection:
    manifest:
      label: IMU失联保护
      priority: 2000
      group: Safety
      icon: health_and_safety
      confirm_message: imu故障，不可恢复状态
    params:
      kp: 20.0
      kd: 1.0
  pd_brake:
    manifest:
      label: 初始姿态
      priority: 980
      group: Base
      icon: settings_backup_restore
      confirm: true
      confirm_message: 机器人将进入初始姿态，所有电机进入PD制动模式，失去支撑能力，请确保机器人处于安全状态
  initial_pos:
    manifest:
      label: 零位模式
      priority: 960
      group: Base
      icon: anchor
  applause:
    manifest:
      label: 鼓掌
      priority: 880
      group: Gesture
      icon: cheer

routes:
  - from: zero_torque
    event: pd_brake
    to: pd_brake
    transition: first_frame_switch
  - from: zero_torque
    event: initial_pos
    to: initial_pos
    transition: first_frame_switch

  - from: pd_brake
    event: zero_torque
    to: zero_torque
  - from: initial_pos
    event: zero_torque
    to: zero_torque
  - from: applause
    event: zero_torque
    to: zero_torque

  - from: pd_brake
    event: initial_pos
    to: initial_pos
    transition: first_frame_switch
  - from: initial_pos
    event: pd_brake
    to: pd_brake
    transition: first_frame_switch
  - from: applause
    event: pd_brake
    to: pd_brake
    transition:
      profile: dual_running_blend
      duration: 1.0

  - from: pd_brake
    event: applause
    to: applause
    transition: dual_running_blend
  - from: initial_pos
    event: applause
    to: applause
    transition: dual_running_blend

actions:
  - from: applause
    event: toggle_pause
    action: toggle_pause
    manifest:
      label: 暂停/继续
      ui: pause
