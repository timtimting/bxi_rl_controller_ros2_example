schema: 1
id: com.bxi.half_demo
name: 半身演示
version: 1.0.0
api: ">=4,<5"
enable: true
entrypoint: plugin:create_mod
visibility: public
requires:
  - id: com.bxi.basic_actions
    version: ">=1,<2"
conflicts: []
python_exports: []
runtime_requirements:
  python: []
  ros:
    - package: rclpy
  system: []

events:
  enter_running: {slot: btn_7, value: 1}
  emergency_zero_torque: {slot: btn_2, value: 1}
  initial_pose: {slot: btn_3, value: 1}
  zero_pose: {slot: btn_4, value: 1}
  running: {slot: btn_9, value: 1}
  arm_range: {slot: btn_8, value: 1}

states:
  running:
    manifest: {label: 悬挂跑步, priority: 900, group: Tests, confirm: true}
    inference_hz: 50.0
  arm_range:
    manifest: {label: 半身行程测试, priority: 890, group: Tests, confirm: true}
    inference_hz: 50.0

routes:
  - {from: com.bxi.basic_actions/pd_brake, event: enter_running, to: running}
  - {from: com.bxi.basic_actions/initial_pos, event: arm_range, to: arm_range}
  - {from: running, event: emergency_zero_torque, to: com.bxi.basic_actions/zero_torque}
  - {from: arm_range, event: emergency_zero_torque, to: com.bxi.basic_actions/zero_torque}

actions:
  - {from: running, event: running, action: stop, manifest: {label: 停止悬挂跑步}}
  - {from: arm_range, event: arm_range, action: stop, manifest: {label: 停止半身行程测试}}
  - {from: running, event: initial_pose, action: to_initial_pose, manifest: {label: 回到初始姿态}}
  - {from: running, event: zero_pose, action: to_zero_pose, manifest: {label: 回到零位模式}}
  - {from: arm_range, event: initial_pose, action: to_initial_pose, manifest: {label: 回到初始姿态}}
  - {from: arm_range, event: zero_pose, action: to_zero_pose, manifest: {label: 回到零位模式}}
