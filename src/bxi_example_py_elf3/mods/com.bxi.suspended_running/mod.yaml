schema: 1
id: com.bxi.suspended_running
name: 半身悬挂跑步测试
version: 1.0.0
api: ">=4,<5"
enable: true
entrypoint: plugin:create_mod
visibility: public
requires:
  - id: com.bxi.basic_actions
    version: ">=1,<2"
conflicts: []
python_exports: []
runtime_requirements:
  python: []
  ros:
    - package: rclpy
  system: []

events:
  enter_test: {slot: btn_8, value: 1}
  exit_test: {slot: btn_8, value: 2}
  running: {slot: btn_9, value: 1}

states:
  idle:
    manifest: {label: 悬挂跑步待机, priority: 910, group: Tests}
    inference_hz: 50.0
  running:
    manifest: {label: 悬挂跑步, priority: 900, group: Tests, confirm: true}
    inference_hz: 50.0

routes:
  - {from: com.bxi.basic_actions/zero_torque, event: enter_test, to: idle}
  - {from: com.bxi.basic_actions/pd_brake, event: enter_test, to: idle}
  - {from: idle, event: running, to: running}
  - {from: idle, event: exit_test, to: com.bxi.basic_actions/zero_torque}
  - {from: running, event: exit_test, to: com.bxi.basic_actions/zero_torque}

actions:
  - {from: running, event: running, action: stop, manifest: {label: 停止悬挂跑步}}
