#程序初始的状态
initial_state: zero_torque

#状态机可视化输出
graph:
  validate: true
  export:
    dot: /tmp/elf3_state_machine.dot
    mermaid: /tmp/elf3_state_machine.mmd

dance_models:
  dance_3:
    class: DanceMotionPolicyGravityIsaaclabV3
    npz: isaaclab_model/face_3.npz
    onnx: isaaclab_model/face3.onnx
    start_frame: 10
    fixed_pos: true
  dance_5:
    class: DanceMotionPolicyGravityIsaaclabV3
    npz: isaaclab_model/face_4.npz
    onnx: isaaclab_model/face4.onnx
    start_frame: 10
    fixed_pos: true
#将MotionCommands映射为事件
remote_events:
  normal_event:
    slot: btn_1
    value: 1
  zero_torque_event:
    slot: btn_2
    value: 1
  pd_brake_event:
    slot: btn_3
    value: 1
  initial_pos_event:
    slot: btn_4
    value: 1
  dance_3_event:
    slot: btn_10
    value: 2
  toggle_dance_pause_event:
    slot: btn_9
    value: 1
  dance_5_event:
    slot: btn_10
    value: 3

#预设的一些过度方式
transition_profiles:

  #直接切换状态，相当于不填transition
  instant:
    duration: 0.0
    exit_behavior: none
    enter_behavior: none

  #软切换，会保持一段时间当前电机状态再切换下一状态
  soft_switch:
    duration: 0.02
    exit_behavior: hold_last_motor
    enter_behavior: hold_last_motor

  #缓慢增加kp或kd过度到目标状态的第一帧
  first_frame_switch:
    exit_duration: 0.02
    enter_duration: 0.1
    exit_behavior: hold_last_motor
    enter_behavior: first_frame_ramp_kp
    data:
      kp_start: zero #kp从0开始过度到目标状态的kp
      kd_start: target #kd从目标状态的kd开始过度

  #旧状态和新状态都持续生成电机目标，再按进入进度混合输出
  dual_running_blend:
    duration: 0.3
    exit_behavior: none
    enter_behavior: dual_running_blend
    data:
      curve: smoothstep
      run_from: true #是否采样当前状态电机
      run_to: true #是否采样目标状态电机
      from_fallback: last_motor 
      to_fallback: first_frame

  dance_entry_blend:
    duration: 1.0
    exit_behavior: none
    enter_behavior: dual_running_blend
    data:
      curve: smootherstep
      run_from: true
      run_to: true
      from_fallback: last_motor
      to_fallback: first_frame
      advance_during_transition: true

#速度的预设配置
speed_profiles:
  normal:
    vx_scale: 1.0
    vx_min: -1.0
    vx_max: 1.0
    vy_scale: 0.5
    yaw_scale: 1.5

#状态机
states:
  normal:
    manifest:
      label: 走路
      index: 0
      group: Base
      icon: directions_walk
    behavior: NormalState
    speed_profile: normal
    transitions:
      on_event:
        zero_torque_event: zero_torque
        pd_brake_event: 
            to: pd_brake
            transition: 
              base: first_frame_switch
              enter_duration: 1.0
        initial_pos_event: 
            to: initial_pos
            transition: 
              base: first_frame_switch
              enter_duration: 1.0
        dance_3_event:
          to: dance_part_3
          transition: dance_entry_blend
        dance_5_event:
          to: dance_part_5
          transition: dance_entry_blend

  zero_torque:
    manifest:
      label: 零力矩
      index: 1
      group: Base
      icon: do_not_disturb_on
    behavior: ZeroTorqueState
    transitions:
      on_event:
        pd_brake_event: 
          to: pd_brake
          transition: 
            base: first_frame_switch
            enter_duration: 1.0
        initial_pos_event: 
          to: initial_pos
          transition: 
            base: first_frame_switch
            enter_duration: 1.0

  pd_brake:
    manifest:
      label: 初始姿态
      index: 2
      group: Base
      icon: settings_backup_restore
    behavior: PdBrakeState
    transitions:
      on_event:
        normal_event:
          to: normal
          transition: soft_switch
        zero_torque_event: zero_torque
        initial_pos_event: 
          to: initial_pos
          transition: 
            base: first_frame_switch
            enter_duration: 1.0

  initial_pos:
    manifest:
      label: 零位模式
      index: 4
      group: Base
      icon: anchor
    behavior: InitialPosState
    transitions:
      on_event:
        pd_brake_event: 
          to: pd_brake
          transition: 
            base: first_frame_switch
            enter_duration: 1.0
        zero_torque_event: zero_torque

  dance_part_3:
    manifest:
      label: 跳舞片段3
      index: 6
      group: Advanced
      icon: star_shine
      confirm: true
      confirm_message: 请确保机器人周围1米范围内没有障碍物
    behavior: DancePlaylistState
    params:
      playlist:
        - {policy: dance_3, ble_trigger_frames: [860]}
      ble_mac: "E0:72:A1:D8:39:8E"
      ble_characteristic_address: "0000ee01-0000-1000-8000-00805f9b34fb"
      ble_write_byte: 0x01
      ble_write_with_response: false
    transitions:
      on_event:
        normal_event:
          to: normal
          transition:
            base: dual_running_blend
            duration: 1.0
        zero_torque_event: zero_torque
        dance_3_event:
          to: dance_part_3
          transition: dance_entry_blend
        dance_5_event:
          to: dance_part_5
          transition: dance_entry_blend
        toggle_dance_pause_event:
          action: toggle_dance_pause

  dance_part_5:
    manifest:
      label: 跳舞片段5
      index: 7
      group: Advanced
      icon: star_shine
      confirm: true
      confirm_message: 请确保机器人周围1米范围内没有障碍物
    behavior: DancePlaylistState
    params:
      playlist:
        - {policy: dance_5, ble_trigger_frames: [1210]}
      ble_mac: "E0:72:A1:D8:39:8E"
      ble_characteristic_address: "0000ee01-0000-1000-8000-00805f9b34fb"
      ble_write_byte: 0x01
      ble_write_with_response: false
    transitions:
      on_event:
        normal_event:
          to: normal
          transition:
            base: dual_running_blend
            duration: 1.0
        zero_torque_event: zero_torque
        dance_3_event:
          to: dance_part_3
          transition: dance_entry_blend
        dance_5_event:
          to: dance_part_5
          transition: dance_entry_blend
        toggle_dance_pause_event:
          action: toggle_dance_pause
