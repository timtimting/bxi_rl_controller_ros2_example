#程序初始的状态
initial_state: zero_torque
#状态机可视化输出
graph:
  validate: true
  export:
    dot: /tmp/elf3_state_machine.dot
    mermaid: /tmp/elf3_state_machine.mmd

#将MotionCommands映射为事件
remote_events:
  normal_event:
    slot: btn_1
    value: 1
  zero_torque_event:
    slot: btn_2
    value: 1
  pd_brake_event:
    slot: btn_3
    value: 1
  initial_pos_event:
    slot: btn_4
    value: 1
  dance_event:
    slot: btn_5
    value: 1
  toggle_dance_pause_event:
    slot: btn_9
    value: 1
  back_flip_event:
    slot: btn_10
    value: 1
  forward_flip_event:
    slot: btn_10
    value: 2
  depth_event:
    slot: btn_10
    value: 7

#预设的一些过度方式
transition_profiles:

  #直接切换状态，相当于不填transition
  instant:
    duration: 0.0
    exit_behavior: none
    enter_behavior: none

  #软切换，会保持一段时间当前电机状态再切换下一状态
  soft_switch:
    duration: 0.02
    exit_behavior: hold_last_motor
    enter_behavior: hold_last_motor

  #缓慢增加kp或kd过度到目标状态的第一帧
  first_frame_switch:
    exit_duration: 0.02
    enter_duration: 0.1
    exit_behavior: hold_last_motor
    enter_behavior: first_frame_ramp_kp
    data:
      kp_start: zero #kp从0开始过度到目标状态的kp
      kd_start: target #kd从目标状态的kd开始过度

  #旧状态和新状态都持续生成电机目标，再按进入进度混合输出
  dual_running_blend:
    duration: 0.3
    exit_behavior: none
    enter_behavior: dual_running_blend
    data:
      curve: smoothstep
      run_from: true #是否采样当前状态电机
      run_to: true #是否采样目标状态电机
      from_fallback: last_motor 
      to_fallback: first_frame

#速度的预设配置
speed_profiles:
  normal:
    vx_scale: 1.0
    vx_min: -1.0
    vx_max: 1.0
    vy_scale: 0.5
    yaw_scale: 1.5

#状态机
states:
  normal:
    manifest:
      label: 走路
      index: 0
      group: Base
      icon: directions_walk
    behavior: NormalState
    speed_profile: normal
    transitions:
      on_event:
        zero_torque_event: zero_torque
        pd_brake_event: 
            to: pd_brake
            transition: 
              base: first_frame_switch
              enter_duration: 1.0
        initial_pos_event: 
            to: initial_pos
            transition: 
              base: first_frame_switch
              enter_duration: 1.0
        dance_event:
          to: dance
          transition: soft_switch
        back_flip_event:
          to: back_flip
          transition: soft_switch
        forward_flip_event:
          to: forward_flip
          transition: soft_switch
        depth_event:
          to: normal_depth
  zero_torque:
    manifest:
      label: 零力矩
      index: 1
      group: Base
      icon: do_not_disturb_on
    behavior: ZeroTorqueState
    transitions:
      on_event:
        pd_brake_event: 
          to: pd_brake
          transition: 
            base: first_frame_switch
            enter_duration: 1.0
        initial_pos_event: 
          to: initial_pos
          transition: 
            base: first_frame_switch
            enter_duration: 1.0
        depth_event:
          to: normal_depth

  pd_brake:
    manifest:
      label: 初始姿态
      index: 2
      group: Base
      icon: settings_backup_restore
    behavior: PdBrakeState
    transitions:
      on_event:
        normal_event:
          to: normal
          transition: soft_switch
        zero_torque_event: zero_torque
        initial_pos_event: 
          to: initial_pos
          transition: 
            base: first_frame_switch
            enter_duration: 1.0

  initial_pos:
    manifest:
      label: 零位模式
      index: 4
      group: Base
      icon: anchor
    behavior: InitialPosState
    transitions:
      on_event:
        pd_brake_event: 
          to: pd_brake
          transition: 
            base: first_frame_switch
            enter_duration: 1.0
        zero_torque_event: zero_torque

  dance:
    manifest:
      label: 跳舞
      index: 5
      group: Advanced
      icon: star_shine
      confirm: true
      confirm_message: 请确保机器人周围1米范围内没有障碍物
    behavior: DanceState
    transitions:
      on_event:
        normal_event:
          to: normal
          transition: 
            base: dual_running_blend
            duration: 1.0
        zero_torque_event: zero_torque
        toggle_dance_pause_event:
          action: toggle_dance_pause

  back_flip:
    manifest:
      label: 后空翻
      index: 9
      group: Advanced
      icon: rotate_left
      confirm: true
      confirm_message: 请确保机器人后方3米范围内没有障碍物
    behavior: BackFlipState
    transitions:
      on_event:
        zero_torque_event: zero_torque

  forward_flip:
    manifest:
      label: 前空翻
      index: 10
      group: Advanced
      icon: rotate_right
      confirm: true
      confirm_message: 请确保机器人前方3米范围内没有障碍物
    behavior: ForwardFlipState
    transitions:
      on_event:
        zero_torque_event: zero_torque

  normal_depth:
    manifest:
      label: 深度行走
      index: 14
      group: Base
      icon: waving_hand
    behavior: NormalDepthState
    speed_profile: normal
    transitions:
      on_event:
        normal_event:
          to: normal
          transition: 
            base: dual_running_blend
            duration: 1.0
        zero_torque_event: zero_torque
        
